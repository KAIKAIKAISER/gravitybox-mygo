name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows-x64, os: ubuntu-latest, platform: "windows/amd64", dir: "windows-amd64" }
          - { name: macOS-arm64, os: macos-latest, platform: "darwin/arm64", dir: "darwin-arm64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify Go tests
        run: go test ./...
      - name: Install NSIS (Windows target on Ubuntu)
        if: matrix.name == 'Windows-x64'
        run: sudo apt-get update && sudo apt-get install -y nsis zip
      - name: Build GravityBox (${{ matrix.platform }})
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Package portable archive & checksums
        shell: bash
        run: |
          mkdir -p release-assets
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          cd "build/${{ matrix.dir }}"
          if [ "${{ matrix.dir }}" = "windows-amd64" ]; then
            for f in *-setup-*.exe; do
              [ -f "$f" ] && cp "$f" ../../release-assets/
            done
            zip -r "../../release-assets/GravityBox-${TAG_NAME}-win-amd64.zip" .
          else
            for f in *.dmg; do
              [ -f "$f" ] && cp "$f" ../../release-assets/
            done
            if [ -d "GravityBox.app" ]; then
              ditto -c -k --sequesterRsrc --keepParent "GravityBox.app" "../../release-assets/GravityBox-${TAG_NAME}-macos-arm64.zip"
            fi
          fi
          cd ../../release-assets
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > "SHA256SUMS-${{ matrix.name }}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-${{ matrix.name }}.txt"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release-assets/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" all-artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" all-artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "GravityBox MyGo $TAG" \
              --generate-notes
          fi
