name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run unit tests & vet
        run: |
          go test -v ./...
          go vet ./...
          GOOS=windows go vet ./...
      - name: Install NSIS for Windows installer packaging
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build Windows x64 binary & installer with MyGo
        run: go tool mygo build -platform windows/amd64
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gravitybox-windows-amd64
          path: build/windows-amd64/*
